version: '3.8'

x-env-config: &common-env
  env_file:
    - .env
  environment:
    PYTHONPATH: /app
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-krabs_payments}
    CELERY_BROKER_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    CELERY_RESULT_BACKEND: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}

services:
  db:
    image: postgres:15-alpine
    container_name: krabs_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-krabs_payments}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-krabs_payments}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krabs_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    <<: *common-env
    build: .
    container_name: krabs_web
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 wsgi:app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    <<: *common-env
    build: .
    container_name: krabs_worker
    restart: always
    command: celery -A celery_worker:celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  flower:
    <<: *common-env
    build: .
    container_name: krabs_flower
    restart: always
    command: celery -A celery_worker:celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - .:/app

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: krabs_stripe_cli
    restart: always
    env_file:
      - .env
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to web:5000/api/v1/webhooks/stripe
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data: